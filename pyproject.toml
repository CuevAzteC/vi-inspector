[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vi-inspector"
version = "1.0.0"
description = "Automated code review for LabVIEW VIs in CI — no LabVIEW license required"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vi-inspector" }]
keywords = ["labview", "code-review", "ci", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pylabview==0.1.2",
    "lvkit==0.8.6",
]

[project.scripts]
vi-inspector = "vi_inspector.cli:main"

[project.urls]
Homepage = "https://github.com/vi-inspector/vi-inspector"
Issues = "https://github.com/vi-inspector/vi-inspector/issues"

[tool.hatch.build.targets.wheel]
packages = ["vi_inspector"]
